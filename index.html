<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zaneta Igbo Calendar</title>
<meta name="theme-color" content="#0e9aa7">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
  :root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { background: #0891b2; font-family: Inter, system-ui, sans-serif; }
  body { color: #fff; min-height: 100vh; min-height: 100dvh; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; background: linear-gradient(160deg, #14b8a6 0%, #0891b2 45%, #7c3aed 100%); }
  button, input, select { font-family: inherit; -webkit-appearance: none; appearance: none; }
  select { background-image: none; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px">Please enable JavaScript to use the Igbo Calendar.</p></noscript>
<script>window.onerror=function(){var r=document.getElementById("root");if(r&&!r.firstChild)r.innerHTML="<p style=\"padding:24px\">This page could not load. Check your internet connection and refresh.</p>";};</script>
<script>
const { useState, useEffect, useMemo } = React;
const h = React.createElement;

/* ---------- Igbo calendar logic ----------
   Anchor (from the reference app): Fri 17 Apr 2026 = Nkwo, day 1 of Ọnwa Ife Eke.
   4-day market week (Nkwo, Eke, Orie, Afor), 7 izu per month = 28 days, 13 months. */
const ANCHOR = Date.UTC(2026, 3, 17);
const ANCHOR_MONTH = 2;
const MARKET = ['Nkwo', 'Eke', 'Orie', 'Afor'];
const MONTHS = ['Ọnwa Mbụ','Ọnwa Abụọ','Ọnwa Ife Eke','Ọnwa Anọ','Ọnwa Agwụ','Ọnwa Ifejiọkụ','Ọnwa Alọm Chi','Ọnwa Ilo Mmụọ','Ọnwa Ana','Ọnwa Okike','Ọnwa Ajana','Ọnwa Ede Ajana','Ọnwa Ụzọ Alụsị'];
const IZU = ['Izu Mbụ','Izu Abụọ','Izu Atọ','Izu Anọ','Izu Ise','Izu Isii','Izu Asaa'];
const UBOCHI = ['Mbụ','Abụọ','Atọ','Anọ','Ise','Isii','Asaa','Asatọ','Iteghete','Iri','Iri na Otu','Iri na Abụọ','Iri na Atọ','Iri na Anọ','Iri na Ise','Iri na Isii','Iri na Asaa','Iri na Asatọ','Iri na Iteghete','Iri abụọ','Iri abụọ na Otu','Iri abụọ na Abụọ','Iri abụọ na Atọ','Iri abụọ na Anọ','Iri abụọ na Ise','Iri abụọ na Isii','Iri abụọ na Asaa','Iri abụọ na Asatọ'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const GMONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const GFULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const mod = (n, m) => ((n % m) + m) % m;

const info = (idx) => {
  const mi = Math.floor(idx / 28);
  const dom = mod(idx, 28) + 1;
  const d = new Date(ANCHOR + idx * 864e5);
  return { idx, market: MARKET[mod(idx, 4)], mi, month: MONTHS[mod(mi + ANCHOR_MONTH, 13)], dom, izu: Math.ceil(dom / 4), date: d,
    label: DOW[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + GMONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(),
    short: d.getUTCDate() + ' ' + GMONTHS[d.getUTCMonth()] };
};
const idxOf = (y, m, d) => Math.round((Date.UTC(y, m, d) - ANCHOR) / 864e5);
const todayIdx = () => { const n = new Date(); return idxOf(n.getFullYear(), n.getMonth(), n.getDate()); };

const STYLE = {
  Nkwo: { badge: 'bg-rose-500 text-white', text: 'text-rose-200', ring: 'ring-rose-200', dot: 'bg-rose-300' },
  Eke:  { badge: 'bg-green-500 text-white', text: 'text-green-200', ring: 'ring-green-200', dot: 'bg-green-300' },
  Orie: { badge: 'bg-yellow-400 text-black', text: 'text-yellow-200', ring: 'ring-yellow-200', dot: 'bg-yellow-300' },
  Afor: { badge: 'bg-fuchsia-500 text-white', text: 'text-fuchsia-200', ring: 'ring-fuchsia-200', dot: 'bg-fuchsia-300' },
};
const MEANING = {
  Nkwo: 'Nkwo is a major market day. Trade is busy, and many people travel to the market to buy and sell.',
  Eke: 'On Eke day, many start new ventures and seek blessings for success.',
  Orie: 'Orie is a day for steady trade and visiting. Many markets hold their gatherings on this day.',
  Afor: 'Afor is a day of commerce and community, often tied to fairness in trade and agreements.',
};
const CATS = [['Market','🛒'],['Planting','🌾'],['Prayer','🙏'],['Festival','🎉'],['Harvest','🍂'],['Meeting','👥'],['Spiritual','✨'],['Personal','📝']];

/* ---------- storage (per-viewer convenience) ---------- */
const loadNotes = () => { try { return JSON.parse(localStorage.getItem('igbo-notes') || '{}'); } catch (e) { return {}; } };
const saveNotes = (n) => { try { localStorage.setItem('igbo-notes', JSON.stringify(n)); } catch (e) {} };


/* ---------- festivals ---------- */
const FESTIVALS = [
 { n: 'Odo Festival', w: 'Nkpologu, Uzo-Uwani (Enugu)', m: [1, 2], when: 'February – March', d: 'Spirit-return festival in which the Odo masquerades visit the community. In some places it is held only every few years.' },
 { n: 'Ikeji Festival', w: 'Arondizuogu (Imo)', m: [2, 3], when: 'March – April', d: 'A well-known masquerade festival, usually around Easter, with colourful Mmanwu performances.' },
 { n: 'Iri Ji Ohuru (New Yam)', w: 'Across Igboland', m: [7, 8], when: 'August – September', d: 'Thanksgiving for the harvest. The new yam is offered to the deities and ancestors before anyone eats it.' },
 { n: 'Ahiajoku (Njoku Ji)', w: 'Across Igboland', m: [7, 8], when: 'August – September', d: 'Honours Ahiajoku, the yam deity, at the time of the yam harvest.' },
 { n: 'Ofala Festival', w: 'Onitsha, Ogidi, Nri and others', m: [9, 10], when: 'October – November', d: 'An annual royal festival where the traditional ruler appears in full regalia, with drums, dances and masquerades.' },
 { n: 'Mmanwu (Masquerade) Season', w: 'Across Igboland', m: [11, 0], when: 'December – January', d: 'Festive season when many communities hold masquerade displays as families return home.' },
 { n: 'Igu Aro (New Year)', w: 'Varies by community', m: null, when: 'Varies', d: 'Marks the turning of the Igbo year. The date is set by community elders and differs from place to place.' },
];
const Festivals = () => {
  const cm = new Date().getMonth();
  const until = (f) => f.m ? Math.min.apply(null, f.m.map((x) => mod(x - cm, 12))) : 99;
  const list = FESTIVALS.slice().sort((a, b) => until(a) - until(b));
  return h('div', { className: 'space-y-3' },
    h('p', { className: 'text-white/85 text-sm' }, 'When the main Igbo cultural festivals usually fall. Dates are approximate and differ between towns, so please confirm with your community elders.'),
    list.map((f) => { const u = until(f);
      return h('div', { key: f.n, className: 'rounded-2xl bg-white/20 p-4 border border-white/25' },
        h('div', { className: 'flex justify-between items-start gap-2' },
          h('div', { className: 'text-lg font-bold text-amber-300' }, f.n),
          u === 0 ? h('span', { className: 'shrink-0 rounded-full bg-emerald-500/20 text-emerald-300 text-[11px] px-2 py-1' }, 'Around now')
            : u < 99 ? h('span', { className: 'shrink-0 rounded-full bg-white/20 text-white/90 text-[11px] px-2 py-1' }, 'In about ' + u + (u === 1 ? ' month' : ' months')) : null),
        h('div', { className: 'text-sm text-white/80 mt-1' }, '📅 ' + f.when),
        h('div', { className: 'text-sm text-white/85' }, '📍 ' + f.w),
        h('p', { className: 'text-sm text-white/90 mt-2' }, f.d));
    }));
};

/* ---------- personal plans & reminders ---------- */
const QUICK = [['Market','🛒'],['Planting','🌾'],['Prayer','🙏'],['Festival','🎉'],['Harvest','🍂'],['Meeting','👥'],['Wedding','💍'],['Birthday','🎂'],['Spiritual','✨'],['Personal','📝']];
const LEADS = [['0','At the time'],['60','1 hour before'],['1440','1 day before'],['-1','No reminder']];
const loadPlans = () => { try { return JSON.parse(localStorage.getItem('igbo-plans') || '[]'); } catch (e) { return []; } };
const savePlans = (p) => { try { localStorage.setItem('igbo-plans', JSON.stringify(p)); } catch (e) {} };
const planTime = (p) => { const a = p.date.split('-').map(Number), b = (p.time || '08:00').split(':').map(Number); return new Date(a[0], a[1] - 1, a[2], b[0], b[1]).getTime(); };
const ymdOf = (idx) => { const d = new Date(ANCHOR + idx * 864e5), z = (n) => (n < 10 ? '0' : '') + n; return d.getUTCFullYear() + '-' + z(d.getUTCMonth() + 1) + '-' + z(d.getUTCDate()); };
const inputCls = 'w-full rounded-xl bg-white/20 px-3 py-2 text-sm outline-none border border-white/30 text-white placeholder:text-white/90';
const leadText = (l) => l < 0 ? 'No reminder' : l === 0 ? 'Reminder at the time' : l === 60 ? 'Reminder 1 hour before' : 'Reminder 1 day before';

const PersonalPlans = ({ plans, setPlans, today }) => {
  const [date, setDate] = useState(ymdOf(today));
  const [time, setTime] = useState('08:00');
  const [lead, setLead] = useState('60');
  const [text, setText] = useState('');
  const [editId, setEditId] = useState(null);
  const [perm, setPerm] = useState(typeof Notification !== 'undefined' ? Notification.permission : 'unsupported');
  const a = date.split('-').map(Number);
  const idx = idxOf(a[0], a[1] - 1, a[2]);
  const d = info(idx), s = STYLE[d.market];
  const byTime = (x, y) => planTime(x) - planTime(y);
  const dayPlans = plans.filter((p) => p.date === date).sort(byTime);
  const later = plans.filter((p) => p.date !== date && !p.done).sort(byTime);
  const add = (cat, icon, title) => setPlans(plans.concat([{ id: Date.now(), title: title || cat, cat, icon, date, time, lead: Number(lead), done: false, notified: false }]));
  const startEdit = (p) => { setEditId(p.id); setText(p.title); setTime(p.time); setLead(String(p.lead)); };
  const saveEdit = () => { setPlans(plans.map((p) => p.id === editId ? { ...p, title: text.trim() || p.title, time, lead: Number(lead), notified: false } : p)); setEditId(null); setText(''); };
  const ask = () => { try { Notification.requestPermission().then(setPerm); } catch (e) { setPerm('denied'); } };
  const row = (p, jump) => h('div', { key: p.id, className: 'rounded-2xl border border-emerald-200/60 bg-emerald-400/25 p-3 flex items-center gap-3 mb-2 ' + (p.done ? 'opacity-60' : '') },
    h('div', { className: 'h-11 w-11 shrink-0 rounded-xl bg-emerald-400/40 flex items-center justify-center text-xl' }, p.icon),
    h('button', { className: 'flex-1 min-w-0 text-left', onClick: jump ? () => setDate(p.date) : undefined },
      h('div', { className: 'text-lg font-bold truncate ' + (p.done ? 'line-through' : '') }, p.title),
      h('div', { className: 'text-xs text-white/85' }, (jump ? p.date + ' · ' : '') + p.time + ' · ' + leadText(p.lead))),
    !jump && h('button', { onClick: () => setPlans(plans.map((x) => x.id === p.id ? { ...x, done: !x.done } : x)), className: 'text-xl px-1', 'aria-label': 'Done' }, p.done ? '↩️' : '✅'),
    !jump && h('button', { onClick: () => startEdit(p), className: 'text-xl px-1', 'aria-label': 'Edit' }, '✏️'),
    h('button', { onClick: () => setPlans(plans.filter((x) => x.id !== p.id)), className: 'text-xl px-1', 'aria-label': 'Delete' }, '🗑️'));
  return h('div', null,
    h('h2', { className: 'text-xl font-bold text-amber-200 mb-3' }, 'My Personal Plans'),
    h('div', { className: 'flex items-center gap-2 mb-4' },
      h('button', { onClick: () => setDate(ymdOf(idx - 1)), className: 'rounded-full bg-white/20 px-3 py-2 text-sm' }, '‹'),
      h('input', { type: 'date', className: inputCls + ' text-center', value: date, onChange: (e) => { if (e.target.value) setDate(e.target.value); } }),
      h('button', { onClick: () => setDate(ymdOf(idx + 1)), className: 'rounded-full bg-white/20 px-3 py-2 text-sm' }, '›'),
      h('button', { onClick: () => setDate(ymdOf(today)), className: 'rounded-full bg-amber-400 text-black px-3 py-2 text-sm font-semibold' }, 'Today')),
    h('div', { className: 'text-3xl font-extrabold' }, 'Ubochi ' + UBOCHI[d.dom - 1] + ' (' + d.dom + ')'),
    h('div', { className: 'mt-2 inline-block rounded-full px-4 py-1.5 font-bold ' + s.badge }, d.market + ' Market Day'),
    h('div', { className: 'mt-3 text-white/85' }, 'Gregorian: ' + d.label),
    h('div', { className: 'mt-3 rounded-2xl bg-white/20 p-3 text-sm flex gap-3' }, h('span', { className: 'text-xl' }, '💡'), h('span', null, MEANING[d.market])),
    h('h3', { className: 'mt-6 mb-2 text-xl font-bold' }, 'My Plans & Notes'),
    dayPlans.length === 0 && h('p', { className: 'text-white/80 text-sm mb-2' }, 'Nothing planned for this day yet.'),
    dayPlans.map((p) => row(p, false)),
    h('h3', { className: 'mt-6 mb-2 text-lg font-bold text-amber-200' }, '⚡ Quick Actions'),
    h('div', { className: 'grid grid-cols-2 gap-2 mb-3' },
      h('label', { className: 'text-xs text-white/85' }, 'Time', h('input', { type: 'time', className: inputCls + ' mt-1', value: time, onChange: (e) => setTime(e.target.value) })),
      h('label', { className: 'text-xs text-white/85' }, 'Remind me', h('select', { className: inputCls + ' mt-1', value: lead, onChange: (e) => setLead(e.target.value) }, LEADS.map((l) => h('option', { key: l[0], value: l[0], style: { color: '#000' } }, l[1]))))),
    h('div', { className: 'grid grid-cols-2 gap-2' }, QUICK.map((q) =>
      h('button', { key: q[0], onClick: () => add(q[0], q[1], text.trim()), className: 'rounded-2xl bg-white/20 active:bg-white/35 py-4 px-4 text-left text-lg font-semibold' }, q[1] + ' ' + q[0]))),
    h('input', { className: inputCls + ' mt-3', placeholder: 'Write a note, e.g. Ada’s wedding', value: text, onChange: (e) => setText(e.target.value) }),
    editId
      ? h('div', { className: 'flex gap-2 mt-2' },
          h('button', { onClick: saveEdit, className: 'flex-1 rounded-2xl bg-emerald-400 text-black font-bold py-3' }, 'Save changes'),
          h('button', { onClick: () => { setEditId(null); setText(''); }, className: 'rounded-2xl bg-white/25 px-5 font-semibold' }, 'Cancel'))
      : h('button', { onClick: () => { if (text.trim()) { add('Note', '📝', text.trim()); setText(''); } }, className: 'w-full mt-2 rounded-2xl bg-amber-400 text-black font-bold py-3 ' + (text.trim() ? '' : 'opacity-60') }, '＋ Add Custom Note'),
    perm === 'default' && h('button', { onClick: ask, className: 'w-full mt-3 text-xs text-amber-200 underline' }, 'Turn on phone notifications (optional)'),
    perm === 'unsupported' && h('p', { className: 'text-[11px] text-white/75 text-center mt-3' }, 'Your browser does not support notifications. Reminders will show on this page while it is open.'),
    later.length > 0 && h('div', null,
      h('h3', { className: 'mt-7 mb-2 text-lg font-bold' }, 'All my other plans'),
      later.map((p) => row(p, true))));
};

/* ---------- components ---------- */
const Pill = ({ children, on, onClick }) =>
  h('button', { onClick, className: 'flex-1 py-2 px-1 rounded-full text-xs sm:text-sm font-medium transition whitespace-nowrap ' + (on ? 'bg-amber-500 text-white' : 'text-white/85') }, children);

const DayCard = ({ d, today, hasNote, onClick }) => {
  const s = STYLE[d.market];
  return h('button', { onClick, className: 'rounded-2xl bg-white/20 py-3 px-1 flex flex-col items-center gap-1 ' + (today ? 'ring-2 ' + s.ring : '') },
    h('span', { className: 'px-2 py-0.5 rounded-md text-sm font-bold ' + s.badge }, d.market),
    h('span', { className: 'text-2xl font-bold' }, d.dom),
    h('span', { className: 'text-[11px] text-white/85 leading-tight text-center' }, d.label.split(' ').slice(0, 2).join(' '), h('br'), d.label.split(' ').slice(2).join(' ')),
    h('span', { className: 'h-1.5 w-1.5 rounded-full ' + (hasNote ? s.dot : 'bg-transparent') }));
};

const DayModal = ({ d, notes, setNotes, onClose }) => {
  const [text, setText] = useState('');
  const list = notes[d.idx] || [];
  const s = STYLE[d.market];
  const add = (cat, icon) => { const next = { ...notes, [d.idx]: [...list, { cat, icon, t: text.trim() || cat }] }; setNotes(next); setText(''); };
  const del = (i) => { const l = list.filter((_, k) => k !== i); const next = { ...notes }; if (l.length) next[d.idx] = l; else delete next[d.idx]; setNotes(next); };
  return h('div', { className: 'fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center', onClick: onClose },
    h('div', { className: 'w-full max-w-md max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl bg-teal-800 p-5 pb-8', onClick: (e) => e.stopPropagation() },
      h('div', { className: 'flex justify-between items-start' },
        h('div', null,
          h('div', { className: 'text-2xl font-bold ' + s.text }, d.market + ' Day'),
          h('div', { className: 'text-white/90' }, 'Ubochi ' + UBOCHI[d.dom - 1] + ' (' + d.dom + ') · ' + IZU[d.izu - 1]),
          h('div', { className: 'text-white/75 text-sm' }, d.month)),
        h('button', { onClick: onClose, className: 'text-white/85 text-2xl leading-none px-2' }, '×')),
      h('div', { className: 'mt-3 text-white/85 text-sm' }, 'Gregorian: ' + d.label),
      h('div', { className: 'mt-3 rounded-2xl bg-white/20 p-3 text-sm flex gap-2' }, h('span', null, '💡'), h('span', null, MEANING[d.market])),
      h('h3', { className: 'mt-5 mb-2 text-lg font-bold' }, 'My Plans & Notes'),
      list.length === 0 && h('p', { className: 'text-white/70 text-sm' }, 'Nothing planned yet.'),
      list.map((n, i) => h('div', { key: i, className: 'flex items-center gap-3 rounded-2xl border border-emerald-200/60 bg-emerald-400/25 p-3 mb-2' },
        h('span', { className: 'text-xl' }, n.icon), h('span', { className: 'flex-1 font-semibold' }, n.t),
        h('button', { onClick: () => del(i), className: 'text-red-400 text-sm' }, 'Delete'))),
      h('h3', { className: 'mt-5 mb-2 text-amber-400 font-bold' }, '⚡ Quick Actions'),
      h('input', { value: text, onChange: (e) => setText(e.target.value), placeholder: 'Add a note (optional), then tap a category', className: 'w-full mb-3 rounded-xl bg-white/20 px-3 py-2 text-sm outline-none placeholder:text-white/70' }),
      h('div', { className: 'grid grid-cols-2 gap-2' }, CATS.map(([c, ic]) =>
        h('button', { key: c, onClick: () => add(c, ic), className: 'rounded-2xl bg-white/20 py-3 text-left px-4 font-semibold active:bg-white/35' }, ic + ' ' + c)))));
};

const MonthView = ({ mi, today, notes, open }) => h('div', { className: 'grid grid-cols-4 gap-2' },
  Array.from({ length: 28 }, (_, k) => { const d = info(mi * 28 + k); return h(DayCard, { key: k, d, today: d.idx === today, hasNote: !!notes[d.idx], onClick: () => open(d) }); }));

const WeekView = ({ mi, today, notes, open }) => h('div', { className: 'space-y-3' },
  IZU.map((name, w) => h('div', { key: w, className: 'rounded-2xl overflow-hidden bg-white/20' },
    h('div', { className: 'bg-white/20 text-center py-2 font-bold text-amber-400' }, name + ' (' + (w + 1) + ')'),
    h('div', { className: 'grid grid-cols-4 py-3' }, Array.from({ length: 4 }, (_, k) => {
      const d = info(mi * 28 + w * 4 + k); const s = STYLE[d.market];
      return h('button', { key: k, onClick: () => open(d), className: 'flex flex-col items-center gap-0.5' },
        h('span', { className: 'text-3xl font-bold' }, d.dom),
        h('span', { className: 'font-bold ' + s.text }, d.market),
        h('span', { className: 'text-xs text-white/75' }, d.short),
        h('span', { className: 'h-1.5 w-1.5 rounded-full ' + (d.idx === today ? 'bg-amber-400' : notes[d.idx] ? 'bg-white/40' : 'bg-transparent') }));
    })))));

const YearView = ({ mi, today, pick }) => {
  const base = Math.floor(mi / 13) * 13;
  return h('div', { className: 'grid grid-cols-2 gap-3' }, Array.from({ length: 13 }, (_, k) => {
    const m = base + k, a = info(m * 28), b = info(m * 28 + 27);
    const cur = Math.floor(today / 28) === m;
    return h('button', { key: k, onClick: () => pick(m), className: 'rounded-2xl bg-white/20 p-4 text-left ' + (cur ? 'ring-2 ring-amber-400' : '') },
      h('div', { className: 'font-bold text-amber-300' }, a.month),
      h('div', { className: 'text-xs text-white/75 mt-1' }, a.short + ' – ' + b.short + ' ' + b.date.getUTCFullYear()));
  }));
};

const Nav = ({ title, sub, prev, next, today }) => h('div', { className: 'flex items-center gap-2 mb-4' },
  h('button', { onClick: prev, className: 'rounded-full bg-white/20 px-3 py-1.5 text-sm' }, '‹ Prev'),
  h('button', { onClick: next, className: 'rounded-full bg-white/20 px-3 py-1.5 text-sm' }, 'Next ›'),
  h('div', { className: 'flex-1 text-center leading-tight' }, h('div', { className: 'font-bold' }, title), h('div', { className: 'text-[11px] text-white/75' }, sub)),
  h('button', { onClick: today, className: 'rounded-full bg-amber-500 px-3 py-1.5 text-sm font-medium' }, 'Today'));

const Planner = ({ notes, open, today, plans, setPlans }) => {
  const [view, setView] = useState('Monthly');
  const [mi, setMi] = useState(Math.floor(today / 28));
  const step = view === 'Year' ? 13 : 1;
  const a = info(mi * 28), b = info(mi * 28 + 27);
  return h('div', null,
    view !== 'My Plans' && h(Nav, { title: view === 'Year' ? 'Igbo Year' : a.month, sub: a.short + ' – ' + b.short + ' ' + b.date.getUTCFullYear(),
      prev: () => setMi(mi - step), next: () => setMi(mi + step), today: () => setMi(Math.floor(today / 28)) }),
    h('div', { className: 'flex rounded-full bg-white/20 p-1 mb-5' }, ['Monthly', 'Weekly', 'Year', 'My Plans'].map((v) => h(Pill, { key: v, on: view === v, onClick: () => setView(v) }, v))),
    view === 'Monthly' && h(React.Fragment, null,
      h('div', { className: 'grid grid-cols-4 text-center font-bold mb-3' }, MARKET.map((m) => h('span', { key: m, className: STYLE[m].text }, m))),
      h(MonthView, { mi, today, notes, open })),
    view === 'Weekly' && h(WeekView, { mi, today, notes, open }),
    view === 'Year' && h(YearView, { mi, today, pick: (m) => { setMi(m); setView('Monthly'); } }),
    view === 'My Plans' && h(PersonalPlans, { plans, setPlans, today }));
};

const GregCalendar = ({ today, notes, open }) => {
  const n = new Date();
  const [ym, setYm] = useState({ y: n.getFullYear(), m: n.getMonth() });
  const first = new Date(Date.UTC(ym.y, ym.m, 1)).getUTCDay();
  const days = new Date(Date.UTC(ym.y, ym.m + 1, 0)).getUTCDate();
  const shift = (k) => { const d = new Date(Date.UTC(ym.y, ym.m + k, 1)); setYm({ y: d.getUTCFullYear(), m: d.getUTCMonth() }); };
  const cells = [...Array(first).fill(null), ...Array.from({ length: days }, (_, i) => i + 1)];
  return h('div', null,
    h(Nav, { title: GFULL[ym.m] + ' ' + ym.y, sub: info(idxOf(ym.y, ym.m, 1)).month, prev: () => shift(-1), next: () => shift(1), today: () => setYm({ y: n.getFullYear(), m: n.getMonth() }) }),
    h('div', { className: 'grid grid-cols-7 text-center text-xs text-white/75 mb-2' }, DOW.map((d) => h('span', { key: d }, d))),
    h('div', { className: 'grid grid-cols-7 gap-1' }, cells.map((c, i) => {
      if (!c) return h('span', { key: i });
      const d = info(idxOf(ym.y, ym.m, c)); const s = STYLE[d.market];
      return h('button', { key: i, onClick: () => open(d), className: 'rounded-xl bg-white/20 py-2 flex flex-col items-center ' + (d.idx === today ? 'ring-2 ' + s.ring : '') },
        h('span', { className: 'font-bold' }, c), h('span', { className: 'text-[10px] font-semibold ' + s.text }, d.market),
        h('span', { className: 'h-1 w-1 mt-0.5 rounded-full ' + (notes[d.idx] ? s.dot : 'bg-transparent') }));
    })),
    h('div', { className: 'flex justify-center gap-4 mt-5 text-xs' }, MARKET.map((m) => h('span', { key: m, className: 'flex items-center gap-1 ' + STYLE[m].text }, h('i', { className: 'h-2 w-2 rounded-full ' + STYLE[m].dot }), m))));
};

const Culture = () => h('div', { className: 'space-y-3' },
  h('p', { className: 'text-white/85 text-sm mb-2' }, 'The Igbo week (Izu) has four market days. Seven izu make one month (Ọnwa) of 28 days.'),
  MARKET.map((m) => h('div', { key: m, className: 'rounded-2xl bg-white/20 p-4' },
    h('div', { className: 'text-xl font-bold ' + STYLE[m].text }, m), h('p', { className: 'text-sm text-white/90 mt-1' }, MEANING[m]))),
  h('div', { className: 'rounded-2xl bg-white/20 p-4' },
    h('div', { className: 'font-bold text-amber-300 mb-2' }, 'Ọnwa (months)'),
    h('div', { className: 'flex flex-wrap gap-2' }, MONTHS.map((m) => h('span', { key: m, className: 'rounded-full bg-white/20 px-3 py-1 text-xs' }, m)))));

const TABS = [['Calendar','📅'],['Planner','🏛️'],['Festivals','🎊'],['Culture','🧩']];

const App = () => {
  const [tab, setTab] = useState('Planner');
  const [notes, setNotesState] = useState({});
  const [sel, setSel] = useState(null);
  const [plans, setPlansState] = useState([]);
  const [now, setNow] = useState(Date.now());
  const setPlans = (n) => { setPlansState(n); savePlans(n); };
  useEffect(() => {
    const check = () => {
      const t = Date.now(); setNow(t); let changed = false;
      const next = plans.map((p) => {
        if (p.done || p.notified || p.lead < 0 || t < planTime(p) - p.lead * 60000) return p;
        changed = true;
        try { if (typeof Notification !== 'undefined' && Notification.permission === 'granted') new Notification(p.icon + ' ' + p.title, { body: 'Reminder: ' + p.cat + ' at ' + p.time }); } catch (e) {}
        return { ...p, notified: true };
      });
      if (changed) setPlans(next);
    };
    check(); const id = setInterval(check, 30000); return () => clearInterval(id);
  }, [plans]);
  const alerts = plans.filter((p) => !p.done && p.lead >= 0 && now >= planTime(p) - p.lead * 60000 && now <= planTime(p) + 864e5);
  const today = useMemo(todayIdx, []);
  useEffect(() => { setNotesState(loadNotes()); setPlansState(loadPlans()); }, []);
  const setNotes = (n) => { setNotesState(n); saveNotes(n); };
  const t = info(today);
  return h('div', { className: 'max-w-md mx-auto px-4 pb-28' },
    h('header', { className: 'py-5 text-center' },
      h('h1', { className: 'text-2xl font-bold' }, tab === 'Calendar' ? 'Igbo Calendar' : tab === 'Planner' ? 'Market Planner' : tab === 'Festivals' ? 'Igbo Festivals' : 'Igbo Culture'),
      h('p', { className: 'text-sm mt-1 ' + STYLE[t.market].text }, 'Today: ' + t.market + ' · ' + t.month + ', Ubochi ' + t.dom)),
    alerts.map((p) => h('div', { key: p.id, className: 'mb-3 rounded-2xl bg-amber-300 text-black border border-amber-500 p-3 flex items-center gap-3' },
      h('span', { className: 'text-2xl' }, '🔔'),
      h('div', { className: 'flex-1 text-sm' }, h('div', { className: 'font-bold' }, p.icon + ' ' + p.title), h('div', { className: 'text-black/70 text-xs' }, info(idxOf(...p.date.split('-').map((v, i) => i === 1 ? v - 1 : +v))).label + ' · ' + p.time)),
      h('button', { onClick: () => setPlans(plans.map((x) => x.id === p.id ? { ...x, done: true } : x)), className: 'text-xs text-black underline' }, 'Dismiss'))),
    tab === 'Calendar' && h(GregCalendar, { today, notes, open: setSel }),
    tab === 'Planner' && h(Planner, { today, notes, open: setSel, plans, setPlans }),
    tab === 'Festivals' && h(Festivals),
    tab === 'Culture' && h(Culture),
    h('nav', { className: 'fixed bottom-0 inset-x-0 bg-teal-900/95 border-t border-white/20', style: { paddingBottom: 'env(safe-area-inset-bottom, 0px)' } },
      h('div', { className: 'max-w-md mx-auto grid grid-cols-4' }, TABS.map(([n, ic]) =>
        h('button', { key: n, onClick: () => setTab(n), className: 'py-3 flex flex-col items-center text-xs ' + (tab === n ? 'text-amber-400 font-bold' : 'text-white/85') },
          h('span', { className: 'text-xl' }, ic), n)))),
    sel && h(DayModal, { d: sel, notes, setNotes, onClose: () => setSel(null) }));
};

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
